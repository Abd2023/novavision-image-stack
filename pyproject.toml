[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novavision-image-stack"
version = "0.1.0"
description = "NovaVision component for accumulating compressed video frames in a bounded FIFO stack."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "pydantic>=1,<3",
]

[tool.setuptools.packages.find]
include = ["src*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

